# code.songofeo.com: the Code Home (Forgejo on the SGIN, scripts/podman/sgin/forgejo.sh).
# Its own file next to songofeo.conf, so nothing in that file changes. The shared TLS and proxy settings
# at the top of songofeo.conf apply here too (nginx reads every conf.d/*.conf into one http block).
#   Every page: Authelia sign-in + TOTP first, and only the users Authelia's rule names (eels).
#   Then Forgejo's own login (with its own 2FA). git push/pull does NOT go through here: it uses SSH
#   on 10.6.9.20:2222 from the LAN or WireGuard, so no git port is ever open to the internet.
# Runbook: docs/code-home/README.md
server {
  listen 443 ssl; http2 on; server_name code.songofeo.com;
  client_max_body_size 512m;        # file uploads in the web page (release files, LFS through the browser)

  location /internal/authelia/authz {
    internal;
    proxy_pass http://127.0.0.1:9091/api/authz/auth-request;
    # a location's own proxy_set_header replaces ALL inherited ones, so list what Authelia needs
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Content-Length ""; proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_pass_request_body off;
  }

  location / {
    auth_request /internal/authelia/authz;
    auth_request_set $redirection_url $upstream_http_location;
    error_page 401 =302 $redirection_url;
    limit_req zone=perip burst=100 nodelay;   # a repo page loads many small files at once
    proxy_read_timeout 10m; proxy_send_timeout 10m;   # big uploads and archive downloads
    proxy_request_buffering off;              # stream uploads to Forgejo instead of onto the gate's small disk
    proxy_buffering off;                      # same for downloads
    proxy_pass http://10.6.9.20:3000;
  }
}
